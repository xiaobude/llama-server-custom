name: Build Tailored llama-server for Hardware (RTX 5060 Ti + i5-13400)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
      - 'master'

permissions:
  contents: write

jobs:
  build-cuda-server:
    name: Build Minimal CUDA llama-server
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda-version: '12.4.1'

      - name: Checkout llama.cpp source
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git llama-source

      - name: Configure CMake (Target RTX 5060 Ti / Ada / Blackwell)
        run: |
          cd llama-source
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="89;90" \
            -DGGML_CUDA_FA_ALL_QUANTS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_VULKAN=OFF \
            -DGGML_SYCL=OFF \
            -DGGML_KOMPUTE=OFF

      - name: Build llama-server
        run: |
          cd llama-source/build
          cmake --build . --config Release --target llama-server -j$(nproc)

      - name: Strip & Package Binary
        run: |
          mkdir -p dist
          BIN_PATH="llama-source/build/bin/llama-server"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH=$(find llama-source/build -name "llama-server" -type f -executable | head -n 1)
          fi
          echo "Found binary at: $BIN_PATH"
          ls -lh "$BIN_PATH"
          strip "$BIN_PATH" || true
          cp "$BIN_PATH" dist/
          if ls llama-source/build/bin/*.so* 1> /dev/null 2>&1; then
            cp llama-source/build/bin/*.so* dist/
          fi
          cd dist
          tar -czvf llama-server-rtx5060ti-linux-x64.tar.gz *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-rtx5060ti-custom
          path: dist/llama-server-rtx5060ti-linux-x64.tar.gz
          retention-days: 7

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || 'v1.0.0' }}
          name: "llama-server Hardware Custom (RTX 5060 Ti + i5-13400)"
          body: |
            ## Tailored llama-server for RTX 5060 Ti 16GB + Intel i5-13400
            - **CUDA Arch**: RTX 5060 Ti / Ada / Blackwell (89, 90) + FlashAttention
            - **CPU Flags**: AVX2, FMA, F16C
            - **Optimizations**: Stripped minimal single-binary build, zero unused dependencies.
          files: dist/llama-server-rtx5060ti-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
