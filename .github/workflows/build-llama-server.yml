name: Build Tailored llama-server for Hardware (RTX 5060 Ti + i5-13400)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag'
        required: true
        default: 'v3.1.0'
  push:
    tags:
      - 'v*'
    branches:
      - 'main'
      - 'master'

permissions:
  contents: write

jobs:
  build-cuda-linux:
    name: Build Linux CUDA Standalone llama-server (sm_120)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.2.0'

      - name: Checkout llama.cpp source & resolve build number
        run: |
          git clone --depth 50 https://github.com/ggml-org/llama.cpp.git llama-source
          cd llama-source
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "custom")

          TAG_RAW=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | grep -o '"tag_name": *"[^"]*"' | sed 's/.*"tag_name": *"//;s/"//')
          TAG_NUM=$(echo "$TAG_RAW" | sed 's/[^0-9]//g')
          if [ -z "$TAG_NUM" ]; then TAG_NUM="0"; fi
          echo "Resolved llama.cpp build number: $TAG_NUM ($COMMIT_HASH)"
          echo "TAG_NUM=$TAG_NUM" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

          # Force CUDA::cudart_static in CMakeLists.txt
          find . -name "CMakeLists.txt" -exec sed -i 's/CUDA::cudart\b/CUDA::cudart_static/g' {} +

      - name: Configure CMake
        run: |
          cd llama-source
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_NUMBER=${{ env.TAG_NUM }} \
            -DLLAMA_BUILD_COMMIT="${{ env.COMMIT_HASH }}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCUDA_USE_STATIC_CUDA_RUNTIME=ON \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="120" \
            -DGGML_CUDA_FA_ALL_QUANTS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_VULKAN=OFF \
            -DGGML_SYCL=OFF \
            -DGGML_KOMPUTE=OFF

      - name: Build llama-server
        run: |
          cd llama-source/build
          cmake --build . --config Release --target llama-server -j$(nproc)

      - name: Verify no dynamic CUDA runtime dependency
        run: |
          BIN_PATH=$(find llama-source/build -name "llama-server" -type f -executable | head -n 1)
          echo "Checking $BIN_PATH"
          ldd "$BIN_PATH" || true
          if ldd "$BIN_PATH" | grep -qiE 'libcudart'; then
            echo "::error::仍然动态链接了 CUDA 运行时，静态化补丁未生效"
            exit 1
          fi

      - name: Package Binary
        run: |
          mkdir -p dist
          BIN_PATH=$(find llama-source/build -name "llama-server" -type f -executable | head -n 1)
          strip "$BIN_PATH" || true
          cp "$BIN_PATH" dist/
          cd dist
          tar -czvf llama-server-rtx5060ti-linux-x64.tar.gz *

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: dist/llama-server-rtx5060ti-linux-x64.tar.gz

  build-cuda-windows:
    name: Build Windows 11 True Single-Binary llama-server (sm_120, Zero DLL)
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '13.2.0'

      - name: Checkout llama.cpp source & Patch Static CUDA Linkage
        shell: powershell
        run: |
          git clone --depth 50 https://github.com/ggml-org/llama.cpp.git llama-source
          Set-Location llama-source
          $commitHash = (git rev-parse --short HEAD 2>$null)
          if (-not $commitHash) { $commitHash = "custom" }

          $tagRaw = ""
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest"
            $tagRaw = $release.tag_name
          } catch { $tagRaw = "" }
          $tagNum = ($tagRaw -replace '[^0-9]', '')
          if (-not $tagNum) { $tagNum = "0" }
          Write-Host "Resolved llama.cpp build number: $tagNum ($commitHash)"
          echo "TAG_NUM=$tagNum" >> $env:GITHUB_ENV
          echo "COMMIT_HASH=$commitHash" >> $env:GITHUB_ENV

          # Patch CUDA::cudart -> CUDA::cudart_static
          Get-ChildItem -Path . -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
              $content = Get-Content $_.FullName -Raw
              $content = $content -replace 'CUDA::cudart\b', 'CUDA::cudart_static'
              Set-Content $_.FullName $content
          }

      - name: Configure CMake (static CUDA runtime, sm_120)
        shell: powershell
        run: |
          Set-Location llama-source
          New-Item -ItemType Directory -Force -Path build
          Set-Location build
          cmake .. `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLAMA_BUILD_NUMBER=${{ env.TAG_NUM }} `
            -DLLAMA_BUILD_COMMIT="${{ env.COMMIT_HASH }}" `
            -DBUILD_SHARED_LIBS=OFF `
            -DCUDA_USE_STATIC_CUDA_RUNTIME=ON `
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Static `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES="120" `
            -DGGML_CUDA_FA_ALL_QUANTS=ON `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX2=ON `
            -DGGML_FMA=ON `
            -DGGML_F16C=ON `
            -DGGML_VULKAN=OFF `
            -DGGML_SYCL=OFF `
            -DGGML_KOMPUTE=OFF

      - name: Build llama-server
        shell: cmd
        run: |
          cd llama-source\build
          cmake --build . --config Release --target llama-server -j 4

      - name: Verify Dependencies with dumpbin (must NOT show cudart DLLs)
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path llama-source\build -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          Write-Host "Found $($exe.FullName)"
          $deps = & dumpbin /DEPENDENTS "$($exe.FullName)" 2>&1
          $deps | Write-Host
          if ($deps -match 'cudart64') {
            Write-Error "仍然动态依赖 cudart 相关 DLL，静态化补丁未完全生效"
            exit 1
          }

      - name: Package True Standalone Executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $exe = Get-ChildItem -Path llama-source\build -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          Copy-Item $exe.FullName -Destination dist\llama-server.exe
          Copy-Item start_server.bat -Destination dist\start_server.bat
          Get-ChildItem -Path dist
          Compress-Archive -Path dist\* -DestinationPath dist\llama-server-rtx5060ti-win-v3.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: dist/llama-server-rtx5060ti-win-v3.zip

  publish-release:
    name: Publish True Standalone Releases (Zero DLL, sm_120)
    needs: [build-cuda-linux, build-cuda-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-artifact
          path: release-files

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact
          path: release-files

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || 'v3.1.0' }}
          name: "llama-server Pure Single-Binary v3.1.0 (Zero DLL Verified, sm_120)"
          body: |
            ## Pure Standalone llama-server (RTX 5060 Ti 16GB, Blackwell sm_120 + Intel i5-13400)
            - **Target arch**: `CMAKE_CUDA_ARCHITECTURES=120` (Blackwell).
            - **Toolchain**: CUDA Toolkit 13.2 via updated `Jimver/cuda-toolkit@v0.2.35`.
            - **Zero DLL Requirement**: cudart patched to static target `CUDA::cudart_static`.
            - **CPU Flags**: AVX2, FMA, F16C (matches i5-13400).
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
