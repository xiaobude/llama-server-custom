name: Build Tailored llama-server for Hardware (RTX 5060 Ti + i5-13400)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-cuda-server:
    name: Build Minimal CUDA llama-server
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Setup CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda-version: '12.4.1'

      - name: Checkout llama.cpp source
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git llama-source

      - name: Configure CMake (Custom Tailored Options)
        run: |
          cd llama-source
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90" \
            -DGGML_CUDA_FA_ALL_QUANTS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_AVX2=ON \
            -DGGML_FMA=ON \
            -DGGML_F16C=ON \
            -DGGML_VULKAN=OFF \
            -DGGML_SYCL=OFF \
            -DGGML_KOMPUTE=OFF

      - name: Build llama-server
        run: |
          cd llama-source/build
          cmake --build . --config Release --target llama-server -j$(nproc)

      - name: Strip & Package Binary
        run: |
          cd llama-source/build
          # Find llama-server binary location
          SERVER_BIN=$(find . -name "llama-server" -type f | head -n 1)
          if [ -z "$SERVER_BIN" ]; then
            echo "llama-server binary not found!"
            exit 1
          fi
          strip "$SERVER_BIN"
          mkdir -p ../../dist
          cp "$SERVER_BIN" ../../dist/llama-server
          cd ../../dist
          tar -czvf llama-server-rtx5060ti-linux-x64.tar.gz llama-server

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-rtx5060ti-custom
          path: dist/llama-server-rtx5060ti-linux-x64.tar.gz
          retention-days: 7
